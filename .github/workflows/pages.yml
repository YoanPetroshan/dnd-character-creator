# Deploy the offline PWA to GitHub Pages (https://yoanpetroshan.github.io/dnd-character-creator/).
# Builds the pinned offline pack (scripts/build_offline.py: sha256-verified downloads), then the static app under the
# /dnd-character-creator/ sub-path, checks the precache manifest lists every file, and publishes frontend/dist.
# No stored credentials: Pages deploys through the workflow's own OIDC identity (permissions below). Every action is pinned by commit SHA
# (tests/test_ci_workflow.py checks that). Owner steps: docs/DEPLOY-PAGES.md.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: python scripts/build_offline.py
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build:offline
        env:
          VITE_BASE: /dnd-character-creator/
          VITE_SERVERLESS: "1"
      - run: cd frontend && REQUIRE_PRECACHE=1 npx vitest run src/offline/precache.dist.test.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
